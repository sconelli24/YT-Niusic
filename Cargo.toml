[package]
name = "yt-niusic"
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/sconelli24/YT-Niusic"
description = "Reproductor de consola TUI ultraliviano para YouTube Music (Amber Monochrome Console)"

[dependencies]
anyhow = "1.0"
bytes = "1.12"
crossterm = "0.29.0"
directories = "6.0"
futures-util = "0.3"
ratatui = { version = "0.30.2", features = ["crossterm_0_29"] }
rfd = "0.18.0"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
rustypipe = { version = "0.11.4", features = ["userdata"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
souvlaki = { version = "0.9.3", default-features = false }
stream-download = "0.24.7"
tokio = { version = "1.54", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "process"] }
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "handshake"] }
tracing = "0.1"
zeroize = "1.9"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_System_Console", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
